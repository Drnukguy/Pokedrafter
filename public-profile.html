<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile — Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand img { display: block; }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .site-nav {
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }
  .site-nav a {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }
  .site-nav a:hover { opacity: 1; }
  .site-nav a.current { opacity: 1; border-bottom-color: var(--gold); }

  .empty-state {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
  }
  .empty-state h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 10px;
  }
  .empty-state p {
    font-size: 0.9rem;
    opacity: 0.7;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ---------- Player identity header ---------- */
  .player-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .player-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--line);
    flex: none;
  }

  .player-avatar-fallback {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.8rem;
    flex: none;
  }

  .player-name {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
  }

  .player-member-since {
    font-size: 0.82rem;
    opacity: 0.6;
    margin-top: 4px;
  }

  /* ---------- Stat grid (shared visual language with the leaderboard) ---------- */
  .board-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  @media (max-width: 560px) {
    .board-stats { grid-template-columns: repeat(2, 1fr); }
  }

  .stat-chip {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 16px;
    text-align: center;
  }
  .stat-chip-num {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--gold);
    line-height: 1;
  }
  .stat-chip-label {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.6;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ---------- Section labels ---------- */
  .section-label {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    border-left: 3px solid var(--gold);
    padding-left: 10px;
    margin-bottom: 18px;
  }

  /* ---------- Best run showcase ---------- */
  .best-run-card {
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 34px;
  }

  .best-run-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .best-run-grade {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
  }

  .best-run-record {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    opacity: 0.8;
  }

  .best-run-team {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .best-run-mon {
    text-align: center;
    width: 66px;
  }
  .best-run-mon img { width: 44px; height: 44px; image-rendering: pixelated; }
  .best-run-mon .mon-name {
    font-size: 0.7rem;
    opacity: 0.8;
    line-height: 1.3;
    margin-top: 2px;
  }
  .best-run-mon .mon-slot {
    font-size: 0.62rem;
    opacity: 0.5;
  }

  /* ---------- Achievements (placeholder for now) ---------- */
  .achievements-placeholder {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 26px;
  }
  .achievements-placeholder p {
    font-size: 0.85rem;
    opacity: 0.6;
    margin: 6px 0 0;
  }

  .site-footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.78rem;
    opacity: 0.55;
  }
  .site-footer a {
    color: inherit;
    text-decoration: underline;
    margin: 0 8px;
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
        <a href="index.html"><img src="pokedrafter-logo.svg" alt="Pokédrafter" style="height:65px; display:block;"></a>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="authStatus" style="font-size:0.8rem;"></span>
        <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div id="profileContent">
    <div class="empty-state">
      <h2>Loading...</h2>
    </div>
  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a>
  </footer>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();

  async function loadAuthStatus() {
    const authStatus = document.getElementById('authStatus');
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (data.loggedIn) {
        authStatus.innerHTML = data.user.name + ' &middot; <a href="/api/auth/logout?redirect=' + encodeURIComponent(location.pathname) + '" style="color:inherit;">Sign out</a>';
      } else {
        authStatus.innerHTML = '<a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a>';
      }
    } catch (e) {
      authStatus.innerHTML = '';
    }
  }
  loadAuthStatus();

  const RANK_COLORS = {
    'S': 'var(--gold)', 'A+': '#2f8f4e', 'A': '#3f9d5c', 'A-': '#5aab74',
    'B+': '#4a7fb5', 'B': '#6b93b8', 'B-': '#8a8a8a'
  };

  function spriteUrl(id) {
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadPublicProfile() {
    const container = document.getElementById('profileContent');

    // Extract the numeric id from a URL like /u/42
    const match = location.pathname.match(/\/u\/(\d+)/);
    const id = match ? match[1] : null;

    if (!id) {
      container.innerHTML = '<div class="empty-state"><h2>No profile specified</h2><p>This link is missing a player id.</p></div>';
      return;
    }

    let data;
    try {
      const res = await fetch('/api/public-profile?id=' + id);
      if (!res.ok) {
        container.innerHTML = '<div class="empty-state"><h2>Profile not found</h2><p>This player doesn\u2019t exist, or the link is incorrect.</p></div>';
        return;
      }
      data = await res.json();
    } catch (err) {
      container.innerHTML = '<div class="empty-state"><h2>Could not load this profile</h2><p>Please try refreshing the page.</p></div>';
      return;
    }

    const nameStyle = data.nameColor ? `color: ${escapeHtml(data.nameColor)};` : '';
    const avatarHtml = data.avatar
      ? `<img class="player-avatar" src="${escapeHtml(data.avatar)}" alt="" onerror="this.outerHTML='<div class=&quot;player-avatar-fallback&quot;>${escapeHtml(data.name.charAt(0).toUpperCase())}</div>';">`
      : `<div class="player-avatar-fallback">${escapeHtml(data.name.charAt(0).toUpperCase())}</div>`;

    let bestRunHtml = '';
    if (data.bestResult) {
      bestRunHtml = `
        <div class="section-label">Best Run</div>
        <div class="best-run-card">
          <div class="best-run-top">
            <span class="best-run-grade" style="color: ${RANK_COLORS[data.bestResult.rank] || 'var(--ink)'};">${escapeHtml(data.bestResult.rank)} Rank</span>
            <span class="best-run-record">${data.bestResult.wins}\u2013${data.bestResult.losses} \u00b7 ${data.bestResult.combinedScore} pts</span>
          </div>
          <div class="best-run-team">
            ${data.bestResult.team.map(p => `
              <div class="best-run-mon">
                <img src="${spriteUrl(p.id)}" alt="" onerror="this.style.display='none'">
                <div class="mon-name">${escapeHtml(p.name)}</div>
                <div class="mon-slot">${escapeHtml(p.slotLabel || '')}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else {
      bestRunHtml = `
        <div class="section-label">Best Run</div>
        <div class="empty-state" style="margin-bottom:34px;">
          <h2>No seasons played yet</h2>
          <p>This player hasn't completed a season yet.</p>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="player-card">
        ${avatarHtml}
        <div>
          <div class="player-name" style="${nameStyle}">${escapeHtml(data.name)}</div>
          <div class="player-member-since">Member since ${formatDate(data.memberSince)}</div>
        </div>
      </div>

      <div class="board-stats">
        <div class="stat-chip">
          <span class="stat-chip-num">${data.totalSeasons}</span>
          <span class="stat-chip-label">Seasons Played</span>
        </div>
        <div class="stat-chip">
          <span class="stat-chip-num">${data.perfectRuns}</span>
          <span class="stat-chip-label">Perfect Seasons</span>
        </div>
        <div class="stat-chip">
          <span class="stat-chip-num">${data.bestResult ? data.bestResult.rank : '\u2014'}</span>
          <span class="stat-chip-label">Best Rank</span>
        </div>
      </div>

      ${bestRunHtml}

      <div class="section-label">Achievements</div>
      <div class="achievements-placeholder">
        <div style="font-family:'Chakra Petch',sans-serif; font-weight:700;">Coming soon</div>
        <p>Achievements and rewards are on the way.</p>
      </div>
    `;

    document.title = data.name + ' — Pokédrafter';
  }
  loadPublicProfile();
</script>
</body>
</html>
