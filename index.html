<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3038546684457553"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hero-brand h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .hero-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex: none;
  }

  .hero-tagline {
    font-size: 0.95rem;
    opacity: 0.7;
    margin: 14px 0 0;
    max-width: 56ch;
    line-height: 1.5;
  }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  @media (min-width: 700px) {
    .card-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 26px 22px;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }

  .card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .card-eyebrow {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.5;
    margin-bottom: 8px;
  }

  .card h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    margin: 0 0 10px;
  }

  .card p {
    font-size: 0.88rem;
    opacity: 0.75;
    line-height: 1.5;
    margin: 0;
  }

  .card.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .card.primary .card-eyebrow { opacity: 0.6; color: var(--gold); }
  .card.primary p { opacity: 0.75; }
  .card.primary:hover { border-color: var(--gold); }

  .data-note {
    margin-top: 40px;
    font-size: 0.72rem;
    opacity: 0.4;
    text-align: center;
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
        <span class="hero-mark"></span>
        <h1>Pokédrafter</h1>
      </div>
      <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
    </div>
    <p class="hero-tagline">Gotta Draft Em' All!</p>
  </header>

  <div class="card-grid">
    <a href="game.html" class="card primary">
      <div class="card-eyebrow">Start here</div>
      <h2>Play</h2>
    </a>

    <a href="leaderboard.html" class="card">
      <div class="card-eyebrow">Rankings</div>
      <h2>Leaderboard</h2>
    </a>

    <a href="profile.html" class="card">
      <div class="card-eyebrow">Your history</div>
      <h2>Profile</h2>
    </a>
  </div>

  <div class="data-note">Pokédrafter is an independent fan project and is not affiliated with Nintendo, Game Freak, or The Pokémon Company.</div>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();
</script>
</body>
</html>
