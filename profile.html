<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hero-brand h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .hero-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex: none;
  }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .site-nav {
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }

  .site-nav a {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }

  .site-nav a:hover { opacity: 1; }
  .site-nav a.current { opacity: 1; border-bottom-color: var(--gold); }

  .empty-state {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
  }

  .empty-state h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 10px;
  }

  .empty-state p {
    font-size: 0.9rem;
    opacity: 0.7;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }

  .board-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .board-row:last-child { border-bottom: none; }

  .board-date {
    font-size: 0.78rem;
    opacity: 0.6;
    width: 90px;
    flex: none;
  }

  .board-grade {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    width: 40px;
    flex: none;
    text-align: center;
  }

  .board-record {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    width: 60px;
    flex: none;
    text-align: center;
  }

  .board-team-preview {
    display: flex;
    gap: 1px;
    flex: 1;
    justify-content: flex-end;
  }

  .board-team-preview img {
    width: 24px;
    height: 24px;
    image-rendering: pixelated;
  }

  .board-score {
    font-size: 0.78rem;
    opacity: 0.6;
    width: 70px;
    flex: none;
    text-align: right;
  }

  @media (max-width: 640px) {
    .board-team-preview { display: none; }
  }

  .section-label {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    border-left: 3px solid var(--gold);
    padding-left: 10px;
    margin-bottom: 14px;
  }

  .settings-panel {
    margin-bottom: 34px;
  }

  /* ---------- Player identity header ---------- */
  .player-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .player-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--line);
    flex: none;
  }

  .player-avatar-fallback {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.8rem;
    flex: none;
  }

  .player-name {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
  }

  .player-member-since {
    font-size: 0.82rem;
    opacity: 0.6;
    margin-top: 4px;
  }

  /* ---------- Stat grid (shared visual language with the leaderboard) ---------- */
  .board-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }
  @media (max-width: 560px) {
    .board-stats { grid-template-columns: repeat(2, 1fr); }
  }

  .stat-chip {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 16px;
    text-align: center;
  }
  .stat-chip-num {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--gold);
    line-height: 1;
  }
  .stat-chip-label {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.6;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ---------- Achievements (placeholder for now) ---------- */
  .achievements-placeholder {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 26px;
  }
  .achievements-placeholder p {
    font-size: 0.85rem;
    opacity: 0.6;
    margin: 6px 0 0;
  }

  .trophy-case {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 26px;
  }
  .trophy-badge {
    width: 84px;
    text-align: center;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 10px 6px;
  }
  .trophy-badge img { width: 40px; height: 40px; image-rendering: pixelated; }
  .trophy-fallback {
    width: 40px; height: 40px; font-size: 1.6rem;
    display: none; align-items: center; justify-content: center; margin: 0 auto;
  }
  .trophy-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    margin-top: 6px;
    line-height: 1.25;
  }
  .trophy-empty { font-size: 0.85rem; opacity: 0.6; }

  /* ---------- Name color/effect rewards (auto-applied by achievements) ---------- */
  @keyframes name-glow {
    0%, 100% { text-shadow: 0 0 4px currentColor; }
    50% { text-shadow: 0 0 10px currentColor, 0 0 16px currentColor; }
  }
  .name-effect-glow { animation: name-glow 2.4s ease-in-out infinite; }

  @keyframes name-glow-strong {
    0%, 100% { text-shadow: 0 0 6px currentColor, 0 0 2px currentColor; }
    50% { text-shadow: 0 0 16px currentColor, 0 0 26px currentColor; }
  }
  .name-effect-glow-strong { animation: name-glow-strong 1.8s ease-in-out infinite; }

  @keyframes name-shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .name-effect-shimmer,
  .name-effect-shimmer-strong {
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .name-effect-shimmer {
    background-image: linear-gradient(90deg, var(--name-c, var(--ink)) 25%, #fff 50%, var(--name-c, var(--ink)) 75%);
    animation: name-shimmer 2.6s linear infinite;
  }
  .name-effect-shimmer-strong {
    background-image: linear-gradient(90deg, var(--name-c, var(--ink)) 15%, #fff 50%, var(--name-c, var(--ink)) 85%);
    animation: name-shimmer 1.4s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .name-effect-glow, .name-effect-glow-strong, .name-effect-shimmer, .name-effect-shimmer-strong {
      animation: none;
    }
  }

  .text-input {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    color: var(--ink);
  }

  .btn-primary {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.85; }

  .link-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    color: var(--ink);
    opacity: 0.6;
    text-decoration: underline;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .link-btn:hover { opacity: 1; }

  .picker-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    touch-action: manipulation;
  }
  .picker-row:last-child { border-bottom: none; }
  .picker-row:hover { background: var(--paper); }
  .picker-row img { width: 28px; height: 28px; image-rendering: pixelated; flex: none; }

  .danger-zone {
    margin-top: 50px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .btn-danger {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background: #a13d3d;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .btn-danger:hover:not(:disabled) { opacity: 0.85; }
  .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }
  .site-footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.78rem;
    opacity: 0.55;
  }
  .site-footer a {
    color: inherit;
    text-decoration: underline;
    margin: 0 8px;
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
  <img src="pokedrafter-logo.svg" alt="Pokédrafter" style="height:65px;">
</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="authStatus" style="font-size:0.8rem;"></span>
        <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="profile.html" class="current">Profile</a>
    </nav>
  </header>

  <div id="profileContent">
    <div class="empty-state">
      <h2>Loading...</h2>
    </div>
  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a>
  </footer>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();

  async function loadAuthStatus() {
    const authStatus = document.getElementById('authStatus');
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (data.loggedIn) {
        window.pokedrafterUser = data.user;
        authStatus.innerHTML = data.user.name + ' &middot; <a href="/api/auth/logout?redirect=' + encodeURIComponent(location.pathname) + '" style="color:inherit;">Sign out</a>';
      } else {
        window.pokedrafterUser = null;
        authStatus.innerHTML = '<a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a>';
      }
    } catch (e) {
      window.pokedrafterUser = null;
      authStatus.innerHTML = '';
    }
  }
  loadAuthStatus();

  const RANK_COLORS = {
    'S': 'var(--gold)', 'A+': '#2f8f4e', 'A': '#3f9d5c', 'A-': '#5aab74',
    'B+': '#4a7fb5', 'B': '#6b93b8', 'B-': '#8a8a8a'
  };

  function spriteUrl(id) {
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function nameEffectAttrs(color, effect) {
    const c = color || 'inherit';
    if (effect === 'shimmer' || effect === 'shimmer-strong') {
      return { cls: 'name-effect-' + effect, style: `--name-c:${c};` };
    }
    if (effect === 'glow' || effect === 'glow-strong') {
      return { cls: 'name-effect-' + effect, style: `color:${c};` };
    }
    return { cls: '', style: `color:${c};` };
  }

  function itemSpriteUrl(iconPath) {
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/${iconPath}`;
  }

  function trophyCaseHtml(achievements) {
    if (!achievements || achievements.length === 0) {
      return '<p class="trophy-empty">No achievements unlocked yet - keep playing!</p>';
    }
    return '<div class="trophy-case">' + achievements.map(a => `
      <div class="trophy-badge" title="${escapeHtml(a.name)}: ${escapeHtml(a.description)}">
        <img src="${itemSpriteUrl(a.icon)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="trophy-fallback">&#127942;</div>
        <div class="trophy-name">${escapeHtml(a.name)}</div>
      </div>
    `).join('') + '</div>';
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function formatMonName(raw) {
    return raw.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  function findMonById(id) {
    return POKEMON_NAMES.find(p => p.id === id);
  }

  function renderFavoritePreview(favId) {
    const preview = document.getElementById('favoritePreview');
    const clearBtn = document.getElementById('clearFavoriteBtn');
    if (favId) {
      const mon = findMonById(favId);
      preview.innerHTML = `<img src="${spriteUrl(favId)}" alt="" style="width:40px;height:40px;image-rendering:pixelated;" onerror="this.style.display='none'"><span style="font-family:'Chakra Petch',sans-serif; font-weight:700;">${escapeHtml(mon ? formatMonName(mon.n) : 'Unknown')}</span>`;
      clearBtn.style.display = '';
    } else {
      preview.innerHTML = '<span style="opacity:0.55; font-size:0.9rem;">No favorite selected</span>';
      clearBtn.style.display = 'none';
    }
  }

  function renderFavoriteResults(query) {
    const resultsEl = document.getElementById('favoriteResults');
    const q = query.trim().toLowerCase();
    let matches = POKEMON_NAMES;
    if (q) matches = matches.filter(p => p.n.toLowerCase().includes(q));
    matches = matches.slice(0, 40); // cap rendered rows for performance

    if (matches.length === 0) {
      resultsEl.innerHTML = '<div style="padding:14px; text-align:center; opacity:0.6; font-size:0.85rem;">No matches.</div>';
      return;
    }

    resultsEl.innerHTML = matches.map(p => `
      <div class="picker-row" data-id="${p.id}">
        <img src="${spriteUrl(p.id)}" alt="" onerror="this.style.display='none'">
        <span>${escapeHtml(formatMonName(p.n))}</span>
      </div>
    `).join('');

    resultsEl.querySelectorAll('.picker-row').forEach(row => {
      row.addEventListener('click', async () => {
        const id = parseInt(row.dataset.id, 10);
        const status = document.getElementById('favoriteSaveStatus');
        status.textContent = 'Saving...';
        try {
          const res = await fetch('/api/profile/settings', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ favoritePokemonId: id })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            renderFavoritePreview(data.favoritePokemonId);
            document.getElementById('favoritePicker').style.display = 'none';
            status.textContent = 'Saved!';
            loadAuthStatus();
          } else {
            status.textContent = data.error || 'Could not save.';
          }
        } catch (err) {
          status.textContent = 'Could not reach the server.';
        }
      });
    });
  }

  async function loadProfile() {
    const container = document.getElementById('profileContent');

    let authData;
    try {
      const meRes = await fetch('/api/auth/me');
      authData = await meRes.json();
    } catch (err) {
      container.innerHTML = '<div class="empty-state"><h2>Could not check sign-in status</h2><p>Please try refreshing the page.</p></div>';
      return;
    }

    if (!authData.loggedIn) {
      container.innerHTML = '<div class="empty-state"><h2>Sign in to see your profile</h2><p><a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a> to track your draft history and past season records.</p></div>';
      return;
    }

    let settingsData = { effectiveName: authData.user.name, customName: null, favoritePokemonId: null };

      // fall back to the name already shown in the header
    }

        <p style="font-size:0.85rem; opacity:0.75; margin-bottom:14px;">You've unlocked a custom name color! Pick any color you like.</p>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="color" id="customColorInput" value="${statsData.nameColor && statsData.nameColor.match(/^#[0-9a-fA-F]{6}$/) ? statsData.nameColor : '#b3801f'}" style="width:50px; height:38px; border:2px solid var(--ink); border-radius:4px; cursor:pointer; background:none; padding:2px;">
          <button class="btn-primary" id="saveCustomColorBtn">Save Color</button>
        </div>
        <div class="status-note" id="customColorStatus" style="margin-top:8px; font-size:0.8rem; opacity:0.7;"></div>
      </div>
      ` : ''}

      <div class="section-label">Achievements</div>
      ${trophyCaseHtml(statsData.achievements)}

      <div class="section-label">Your history</div>
      <div id="historyContent"><div class="empty-state"><h2>Loading...</h2></div></div>

      <div class="danger-zone">
        <div class="section-label" style="border-left-color: #a13d3d;">Danger zone</div>
        <p style="font-size:0.85rem; opacity:0.75; margin-bottom:14px;">Permanently delete your account and all your saved game history. This cannot be undone.</p>
        <button class="btn-danger" id="deleteAccountBtn">Delete My Account</button>
        <div class="status-note" id="deleteStatus" style="margin-top:10px; font-size:0.8rem;"></div>
      </div>
    `;

    document.getElementById('copyProfileLinkBtn').addEventListener('click', async () => {
      const status = document.getElementById('copyLinkStatus');
      try {
        await navigator.clipboard.writeText(publicProfileUrl);
        status.textContent = 'Copied!';
      } catch (err) {
        status.textContent = 'Could not copy automatically - select and copy the link above.';
      }
    });

    renderFavoritePreview(settingsData.favoritePokemonId);

    document.getElementById('chooseFavoriteBtn').addEventListener('click', () => {
      const picker = document.getElementById('favoritePicker');
      const isOpen = picker.style.display !== 'none';
      picker.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) {
        document.getElementById('favoriteSearchInput').value = '';
        renderFavoriteResults('');
      }
    });

    document.getElementById('favoriteSearchInput').addEventListener('input', (e) => {
      renderFavoriteResults(e.target.value);
    });

    document.getElementById('clearFavoriteBtn').addEventListener('click', async () => {
      const status = document.getElementById('favoriteSaveStatus');
      status.textContent = 'Clearing...';
      try {
        const res = await fetch('/api/profile/settings', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clearFavorite: true })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          renderFavoritePreview(null);
          status.textContent = 'Cleared.';
          loadAuthStatus();
        } else {
          status.textContent = data.error || 'Could not clear.';
        }
      } catch (err) {
        status.textContent = 'Could not reach the server.';
      }
    });

    document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
      const confirmed = confirm('Are you sure you want to permanently delete your Pok\u00e9drafter account? This will remove your profile and all saved game history, and cannot be undone.');
      if (!confirmed) return;

      const btn = document.getElementById('deleteAccountBtn');
      const status = document.getElementById('deleteStatus');
      btn.disabled = true;
      status.textContent = 'Deleting your account...';

      try {
        const res = await fetch('/api/profile/delete', { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.ok) {
          status.textContent = 'Your account has been deleted. Redirecting...';
          loadAuthStatus();
          setTimeout(() => { location.href = 'index.html'; }, 1500);
        } else {
          status.textContent = data.error || 'Could not delete your account.';
          btn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'Could not reach the server.';
        btn.disabled = false;
      }
    });

    document.getElementById('saveNameBtn').addEventListener('click', async () => {
      const input = document.getElementById('displayNameInput');
      const status = document.getElementById('nameSaveStatus');
      status.textContent = 'Saving...';
      try {
        const res = await fetch('/api/profile/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName: input.value })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          loadAuthStatus();
          loadProfile();
        } else {
          status.textContent = data.error || 'Could not save.';
        }
      } catch (err) {
        status.textContent = 'Could not reach the server.';
      }
    });

    const resetBtn = document.getElementById('resetNameBtn');
    if (resetBtn) {
      resetBtn.addEventListener('click', async () => {
        const status = document.getElementById('nameSaveStatus');
        status.textContent = 'Resetting...';
        try {
          const res = await fetch('/api/profile/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reset: true })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            loadAuthStatus();
            loadProfile();
          } else {
            status.textContent = data.error || 'Could not reset.';
          }
        } catch (err) {
          status.textContent = 'Could not reach the server.';
        }
      });
    }

    const saveColorBtn = document.getElementById('saveCustomColorBtn');
    if (saveColorBtn) {
      saveColorBtn.addEventListener('click', async () => {
        const color = document.getElementById('customColorInput').value;
        const status = document.getElementById('customColorStatus');
        status.textContent = 'Saving...';
        try {
          const res = await fetch('/api/profile/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customColor: color })
          });
          const data = await res.json();
          if (res.ok && data.ok) {
            status.textContent = 'Saved!';
            loadAuthStatus();
            loadProfile();
          } else {
            status.textContent = data.error || 'Could not save.';
          }
        } catch (err) {
          status.textContent = 'Could not reach the server.';
        }
      });
    }

    const historyContainer = document.getElementById('historyContent');
    try {
      const res = await fetch('/api/profile/history');
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      if (!data.history || data.history.length === 0) {
        historyContainer.innerHTML = '<div class="empty-state"><h2>No runs yet</h2><p>Play a season on the Play page and it will show up here.</p></div>';
        return;
      }

      historyContainer.innerHTML = '<ul class="board-list">' + data.history.map(run => `
        <li class="board-row">
          <span class="board-date">${formatDate(run.createdAt)}</span>
          <span class="board-grade" style="color: ${RANK_COLORS[run.rank] || 'var(--ink)'};">${escapeHtml(run.rank)}</span>
          <span class="board-record">${run.wins}\u2013${run.losses}</span>
          <span class="board-team-preview">${run.team.map(p => `<img src="${spriteUrl(p.id)}" alt="" onerror="this.style.display='none'">`).join('')}</span>
          <span class="board-score">${run.combinedScore} pts</span>
        </li>
      `).join('') + '</ul>';
    } catch (err) {
      historyContainer.innerHTML = '<div class="empty-state"><h2>Could not load your history</h2><p>Please try refreshing the page.</p></div>';
    }
  }
  loadProfile();
</script>
</body>
</html>
