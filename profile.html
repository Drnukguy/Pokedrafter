<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hero-brand h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .hero-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex: none;
  }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .site-nav {
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }

  .site-nav a {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }

  .site-nav a:hover { opacity: 1; }
  .site-nav a.current { opacity: 1; border-bottom-color: var(--gold); }

  .empty-state {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
  }

  .empty-state h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 10px;
  }

  .empty-state p {
    font-size: 0.9rem;
    opacity: 0.7;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
  <img src="pokedrafter-logo.svg" alt="Pokédrafter" style="height:44px;">
</div>
      <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="profile.html" class="current">Profile</a>
    </nav>
  </header>

  <div class="empty-state">
    <h2>Profiles are coming soon</h2>
  </div>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();
</script>
</body>
</html>
