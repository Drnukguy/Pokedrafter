<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hero-brand h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .hero-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex: none;
  }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .site-nav {
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }

  .site-nav a {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }

  .site-nav a:hover { opacity: 1; }
  .site-nav a.current { opacity: 1; border-bottom-color: var(--gold); }

  .empty-state {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
  }

  .empty-state h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 10px;
  }

  .empty-state p {
    font-size: 0.9rem;
    opacity: 0.7;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }

  .board-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .board-row:last-child { border-bottom: none; }

  .board-date {
    font-size: 0.78rem;
    opacity: 0.6;
    width: 90px;
    flex: none;
  }

  .board-grade {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    width: 40px;
    flex: none;
    text-align: center;
  }

  .board-record {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    width: 60px;
    flex: none;
    text-align: center;
  }

  .board-team-preview {
    display: flex;
    gap: 1px;
    flex: 1;
    justify-content: flex-end;
  }

  .board-team-preview img {
    width: 24px;
    height: 24px;
    image-rendering: pixelated;
  }

  .board-score {
    font-size: 0.78rem;
    opacity: 0.6;
    width: 70px;
    flex: none;
    text-align: right;
  }

  @media (max-width: 640px) {
    .board-team-preview { display: none; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
  <img src="pokedrafter-logo.svg" alt="Pokédrafter" style="height:65px;">
</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="authStatus" style="font-size:0.8rem;"></span>
        <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="profile.html" class="current">Profile</a>
    </nav>
  </header>

  <div id="profileContent">
    <div class="empty-state">
      <h2>Loading...</h2>
    </div>
  </div>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();

  async function loadAuthStatus() {
    const authStatus = document.getElementById('authStatus');
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (data.loggedIn) {
        window.pokedrafterUser = data.user;
        authStatus.innerHTML = data.user.name + ' &middot; <a href="/api/auth/logout?redirect=' + encodeURIComponent(location.pathname) + '" style="color:inherit;">Sign out</a>';
      } else {
        window.pokedrafterUser = null;
        authStatus.innerHTML = '<a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a>';
      }
    } catch (e) {
      window.pokedrafterUser = null;
      authStatus.innerHTML = '';
    }
  }
  loadAuthStatus();

  const RANK_COLORS = {
    'S': 'var(--gold)', 'A+': '#2f8f4e', 'A': '#3f9d5c', 'A-': '#5aab74',
    'B+': '#4a7fb5', 'B': '#6b93b8', 'B-': '#8a8a8a'
  };

  function spriteUrl(id) {
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadProfile() {
    const container = document.getElementById('profileContent');

    let authData;
    try {
      const meRes = await fetch('/api/auth/me');
      authData = await meRes.json();
    } catch (err) {
      container.innerHTML = '<div class="empty-state"><h2>Could not check sign-in status</h2><p>Please try refreshing the page.</p></div>';
      return;
    }

    if (!authData.loggedIn) {
      container.innerHTML = '<div class="empty-state"><h2>Sign in to see your profile</h2><p><a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a> to track your draft history and past season records.</p></div>';
      return;
    }

    try {
      const res = await fetch('/api/profile/history');
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      if (!data.history || data.history.length === 0) {
        container.innerHTML = '<div class="empty-state"><h2>No runs yet</h2><p>Play a season on the Play page and it will show up here.</p></div>';
        return;
      }

      container.innerHTML = '<ul class="board-list">' + data.history.map(run => `
        <li class="board-row">
          <span class="board-date">${formatDate(run.createdAt)}</span>
          <span class="board-grade" style="color: ${RANK_COLORS[run.rank] || 'var(--ink)'};">${escapeHtml(run.rank)}</span>
          <span class="board-record">${run.wins}\u2013${run.losses}</span>
          <span class="board-team-preview">${run.team.map(p => `<img src="${spriteUrl(p.id)}" alt="" onerror="this.style.display='none'">`).join('')}</span>
          <span class="board-score">${run.combinedScore} pts</span>
        </li>
      `).join('') + '</ul>';
    } catch (err) {
      container.innerHTML = '<div class="empty-state"><h2>Could not load your history</h2><p>Please try refreshing the page.</p></div>';
    }
  }
  loadProfile();
</script>
</body>
</html>
