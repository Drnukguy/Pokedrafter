<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Pokédrafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1b1b1f;
    --paper: #f6f2e9;
    --panel: #ffffff;
    --line: #e4dcc8;
    --gold: #b3801f;
  }

  html.dark-mode {
    --ink: #ede8dd;
    --paper: #15141a;
    --panel: #1e1d26;
    --line: #3a3745;
    --gold: #d9a54b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .app-shell {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .hero {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .hero-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hero-brand h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .hero-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex: none;
  }

  .nav-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    background: #1b1b1f;
    color: #ffffff;
    border: 1px solid #1b1b1f;
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { opacity: 0.85; }

  .site-nav {
    display: flex;
    gap: 18px;
    margin-top: 14px;
  }

  .site-nav a {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    border-bottom: 2px solid transparent;
    padding-bottom: 2px;
  }

  .site-nav a:hover { opacity: 1; }
  .site-nav a.current { opacity: 1; border-bottom-color: var(--gold); }

  .empty-state {
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 4px;
    padding: 48px 24px;
    text-align: center;
  }

  .empty-state h2 {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 1.15rem;
    margin: 0 0 10px;
  }

  .empty-state p {
    font-size: 0.9rem;
    opacity: 0.7;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* ---------- Stat banner ---------- */
  .board-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }

  .stat-chip {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 16px;
    text-align: center;
  }

  .stat-chip-num {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--gold);
    line-height: 1;
  }

  .stat-chip-label {
    display: block;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.6;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ---------- Tabs (structured so future filters slot in cleanly) ---------- */
  .board-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .board-tab {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 18px;
    cursor: pointer;
    opacity: 0.6;
  }
  .board-tab.active {
    opacity: 1;
    border-color: var(--gold);
    background: var(--gold);
    color: #1b1b1f;
  }
  .board-tab:hover:not(.active) { opacity: 0.85; }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }

  .board-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    touch-action: manipulation;
  }
  .board-row:hover { background: var(--paper); }
  .board-list > li:last-child { border-bottom: none; }

  .board-rank-num {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    width: 30px;
    flex: none;
    opacity: 0.6;
  }

  .board-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: none;
    background: var(--line);
    object-fit: cover;
  }

  .board-avatar-fallback {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: none;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
  }

  .board-name {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: inherit;
    text-decoration: none;
  }
  .board-name:hover { text-decoration: underline; }

  .board-grade {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    width: 34px;
    flex: none;
    text-align: center;
    border-radius: 20px;
    padding: 3px 0;
  }

  .board-record {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    width: 56px;
    flex: none;
    text-align: center;
    font-size: 0.9rem;
  }

  .board-score {
    font-size: 0.78rem;
    opacity: 0.6;
    width: 66px;
    flex: none;
    text-align: right;
  }

  .board-expand-icon {
    flex: none;
    opacity: 0.4;
    font-size: 0.75rem;
    width: 14px;
    text-align: center;
    transition: transform 0.15s ease;
  }
  .board-row.expanded .board-expand-icon { transform: rotate(180deg); }

  .board-detail-row {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .board-detail-row:last-child { border-bottom: none; }

  .board-detail-team {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 16px 14px 56px;
  }

  .board-detail-mon {
    text-align: center;
    width: 64px;
  }

  .board-detail-mon img {
    width: 40px;
    height: 40px;
    image-rendering: pixelated;
  }

  .board-detail-mon .mon-name {
    font-size: 0.68rem;
    opacity: 0.75;
    line-height: 1.3;
    margin-top: 2px;
  }

  .board-detail-mon .mon-slot {
    font-size: 0.6rem;
    opacity: 0.5;
  }


  /* ---------- Name color/effect rewards (auto-applied by achievements) ---------- */
  @keyframes name-glow {
    0%, 100% { text-shadow: 0 0 4px currentColor; }
    50% { text-shadow: 0 0 10px currentColor, 0 0 16px currentColor; }
  }
  .name-effect-glow { animation: name-glow 2.4s ease-in-out infinite; }

  @keyframes name-glow-strong {
    0%, 100% { text-shadow: 0 0 6px currentColor, 0 0 2px currentColor; }
    50% { text-shadow: 0 0 16px currentColor, 0 0 26px currentColor; }
  }
  .name-effect-glow-strong { animation: name-glow-strong 1.8s ease-in-out infinite; }

  @keyframes name-shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .name-effect-shimmer,
  .name-effect-shimmer-strong {
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .name-effect-shimmer {
    background-image: linear-gradient(90deg, var(--name-c, var(--ink)) 25%, #fff 50%, var(--name-c, var(--ink)) 75%);
    animation: name-shimmer 2.6s linear infinite;
  }
  .name-effect-shimmer-strong {
    background-image: linear-gradient(90deg, var(--name-c, var(--ink)) 15%, #fff 50%, var(--name-c, var(--ink)) 85%);
    animation: name-shimmer 1.4s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .name-effect-glow, .name-effect-glow-strong, .name-effect-shimmer, .name-effect-shimmer-strong {
      animation: none;
    }
  }

  @media (max-width: 640px) {
    .board-score { display: none; }
  }

  /* ---------- Pagination ---------- */
  .board-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 20px;
  }

  .page-btn {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 4px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--gold); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page-indicator {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.85rem;
    opacity: 0.7;
    font-variant-numeric: tabular-nums;
  }

  .site-footer {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.78rem;
    opacity: 0.55;
  }
  .site-footer a {
    color: inherit;
    text-decoration: underline;
    margin: 0 8px;
  }
</style>
</head>
<body>
<div class="app-shell">

  <header class="hero">
    <div class="hero-top">
      <div class="hero-brand">
  <a href="index.html"><img src="pokedrafter-logo.svg" alt="Pokédrafter" style="height:65px; display:block;"></a>
</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="authStatus" style="font-size:0.8rem;"></span>
        <button class="nav-btn" id="themeToggle">&#127769; Dark Mode</button>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="game.html">Play</a>
      <a href="leaderboard.html" class="current">Leaderboard</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="board-stats">
    <div class="stat-chip">
      <span class="stat-chip-num" id="statPerfect">—</span>
      <span class="stat-chip-label">Perfect Seasons</span>
    </div>
    <div class="stat-chip">
      <span class="stat-chip-num" id="statPlayers">—</span>
      <span class="stat-chip-label">Total Players</span>
    </div>
  </div>

  <div class="board-tabs">
    <button class="board-tab active" data-tab="alltime">All-Time</button>
    <!-- Future filters (This Week, By Type, etc.) can be added as siblings here -->
  </div>

  <div id="leaderboardContent">
    <div class="empty-state">
      <h2>Loading leaderboard...</h2>
    </div>
  </div>

  <div class="board-pagination" id="boardPagination" style="display:none;">
    <button class="page-btn" id="prevPageBtn">&larr; Prev</button>
    <span class="page-indicator" id="pageIndicator">Page 1 of 1</span>
    <button class="page-btn" id="nextPageBtn">Next &rarr;</button>
  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a>
  </footer>

</div>

<script>
  const themeToggle = document.getElementById('themeToggle');
  let darkMode = false;
  try { darkMode = localStorage.getItem('pokedrafter-theme') === 'dark'; } catch (e) {}
  function applyTheme() {
    document.documentElement.classList.toggle('dark-mode', darkMode);
    themeToggle.innerHTML = darkMode ? '&#9728;&#65039; Light Mode' : '&#127769; Dark Mode';
    try { localStorage.setItem('pokedrafter-theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
  themeToggle.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });
  applyTheme();

  async function loadAuthStatus() {
    const authStatus = document.getElementById('authStatus');
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if (data.loggedIn) {
        window.pokedrafterUser = data.user;
        authStatus.innerHTML = data.user.name + ' &middot; <a href="/api/auth/logout?redirect=' + encodeURIComponent(location.pathname) + '" style="color:inherit;">Sign out</a>';
      } else {
        window.pokedrafterUser = null;
        authStatus.innerHTML = '<a href="/api/auth/login" style="color:inherit; text-decoration:underline;">Sign in with Google</a>';
      }
    } catch (e) {
      window.pokedrafterUser = null;
      authStatus.innerHTML = '';
    }
  }
  loadAuthStatus();

  const RANK_COLORS = {
    'S': 'var(--gold)', 'A+': '#2f8f4e', 'A': '#3f9d5c', 'A-': '#5aab74',
    'B+': '#4a7fb5', 'B': '#6b93b8', 'B-': '#8a8a8a'
  };
  const RANK_BG = {
    'S': 'color-mix(in srgb, var(--gold) 20%, transparent)',
    'A+': 'rgba(47,143,78,0.15)', 'A': 'rgba(63,157,92,0.15)', 'A-': 'rgba(90,171,116,0.15)',
    'B+': 'rgba(74,127,181,0.15)', 'B': 'rgba(107,147,184,0.15)', 'B-': 'rgba(138,138,138,0.15)'
  };

  function spriteUrl(id) {
    return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function nameEffectAttrs(color, effect) {
    const c = color || 'inherit';
    if (effect === 'shimmer' || effect === 'shimmer-strong') {
      return { cls: 'name-effect-' + effect, style: `--name-c:${c};` };
    }
    if (effect === 'glow' || effect === 'glow-strong') {
      return { cls: 'name-effect-' + effect, style: `color:${c};` };
    }
    return { cls: '', style: `color:${c};` };
  }

  function avatarHtml(e) {
    if (e.avatar) {
      return `<img class="board-avatar" src="${escapeHtml(e.avatar)}" alt="" onerror="this.outerHTML='<div class=&quot;board-avatar-fallback&quot;>${escapeHtml(e.name.charAt(0).toUpperCase())}</div>';">`;
    }
    return `<div class="board-avatar-fallback">${escapeHtml(e.name.charAt(0).toUpperCase())}</div>`;
  }

  let currentPage = 1;
  let currentEntries = [];

  async function loadLeaderboard(page) {
    currentPage = page || 1;
    const container = document.getElementById('leaderboardContent');
    const pagination = document.getElementById('boardPagination');

    try {
      const res = await fetch('/api/leaderboard?page=' + currentPage);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      document.getElementById('statPerfect').textContent = data.perfectRuns;
      document.getElementById('statPlayers').textContent = data.totalPlayers;

      currentEntries = data.entries || [];

      if (currentEntries.length === 0) {
        container.innerHTML = '<div class="empty-state"><h2>No results yet</h2><p>Be the first to complete a season and claim the top spot.</p></div>';
        pagination.style.display = 'none';
        return;
      }

      const rankOffset = (currentPage - 1) * 20;

      container.innerHTML = '<ul class="board-list">' + currentEntries.map((e, i) => `
        <li class="board-row" data-idx="${i}">
          <span class="board-rank-num">#${rankOffset + i + 1}</span>
          ${avatarHtml(e)}
          <a class="board-name ${nameEffectAttrs(e.nameColor, e.nameEffect).cls}" href="/u/${e.id}" style="${nameEffectAttrs(e.nameColor, e.nameEffect).style}" onclick="event.stopPropagation();">${escapeHtml(e.name)}</a>
          <span class="board-grade" style="color: ${RANK_COLORS[e.rank] || 'var(--ink)'}; background: ${RANK_BG[e.rank] || 'transparent'};">${escapeHtml(e.rank)}</span>
          <span class="board-record">${e.wins}\u2013${e.losses}</span>
          <span class="board-score">${e.combinedScore} pts</span>
          <span class="board-expand-icon">&#9660;</span>
        </li>
        <li class="board-detail-row" id="detail-${i}" style="display:none;"></li>
      `).join('') + '</ul>';

      container.querySelectorAll('.board-row').forEach(row => {
        row.addEventListener('click', () => {
          const idx = parseInt(row.dataset.idx, 10);
          const detailRow = document.getElementById('detail-' + idx);
          const isOpen = detailRow.style.display !== 'none';

          if (isOpen) {
            detailRow.style.display = 'none';
            row.classList.remove('expanded');
            return;
          }

          const entry = currentEntries[idx];
          detailRow.innerHTML = `<div class="board-detail-team">${entry.team.map(p => `
            <div class="board-detail-mon">
              <img src="${spriteUrl(p.id)}" alt="" onerror="this.style.display='none'">
              <div class="mon-name">${escapeHtml(p.name)}</div>
              <div class="mon-slot">${escapeHtml(p.slotLabel || '')}</div>
            </div>
          `).join('')}</div>`;
          detailRow.style.display = 'block';
          row.classList.add('expanded');
        });
      });

      pagination.style.display = 'flex';
      document.getElementById('pageIndicator').textContent = `Page ${data.page} of ${data.totalPages}`;
      document.getElementById('prevPageBtn').disabled = data.page <= 1;
      document.getElementById('nextPageBtn').disabled = data.page >= data.totalPages;
    } catch (err) {
      container.innerHTML = '<div class="empty-state"><h2>Could not load the leaderboard</h2><p>Please try refreshing the page.</p></div>';
      pagination.style.display = 'none';
    }
  }

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (currentPage > 1) loadLeaderboard(currentPage - 1);
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    loadLeaderboard(currentPage + 1);
  });

  loadLeaderboard(1);
</script>
</body>
</html>
